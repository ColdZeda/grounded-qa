# 图片 fixture 的**真值**（2026-10-22）
#
# ⚠️ **按图核对写出来的**，不是照 `image-prompts.md` 的期望值抄的 ——
#    文生图经常把 `E1024`、`1,280.00` 这类串画错，照期望值填等于让评测测空气。
#    核对记录：7 张逐张打开看过（2026-10-22），全部与下表一致。
#
# 断言口径（`evals/run.py --layer image`）：
#   · `must_have`     —— 模型转写里**必须出现**的串。比较前做"骨架归一化"：
#                        去掉空格与 `¥ , . ：` 并转小写（`¥1,280.00` → `128000`）。
#                        ⚠️ 为什么不比原串：模型把 `¥1,280.00` 写成 `¥1280.00` 是**对的**，
#                        按原串比会把正确答案判成读错。
#   · `scene_any`     —— 无文字图的描述里**命中任一**关键词就算看懂（同义替换太多，不能硬比）。
#   · `has_exact_fields` —— 省略 = **不断言**（模型说 true 或 false 都算合理）。
#   · `question` / `required_points` —— 只有**三张**配了题（见下），用来做"有图 / 无图"对照。

# ---------------------------------------------------------------- 有文字的图

- file: waybill-01.jpg
  kind: 面单（实拍）
  # 图里还有条形码与它下面的 10001128 —— 那个**不是**单号，正好当负样本：
  # 单号抽取会把 10001128 当候选去查库，查不到 → 什么都不该进上下文。
  must_have: ["SF10001", "¥1,280.00", "2026-10-17"]
  has_exact_fields: true
  order_no: SF10001
  question: "我这单申请退款了，钱多久能到账？"
  required_points:
    # ⚠️ 第一条是**故意放订单号的**：不带图时模型根本不知道是哪一单，
    #    这条必然拿不到 —— 这正是"图里有单号"的价值所在（`SF10001` 是骨架比较，认大小写无关）。
    - "订单号 SF10001"
    - "信用卡 / PayPal 3~5 个工作日"

- file: order-page-02.png
  kind: 订单详情截图
  must_have: ["SF10002", "¥459.00", "已签收"]
  has_exact_fields: true
  order_no: SF10002

- file: error-01.jpg
  kind: 报错弹窗截图
  must_have: ["支付失败", "E1024"]
  # ⚠️ `E1024` 是 1 个字母 + 4 位数字，**不符合**我们"6 位以上连续数字 / 形如 SF10001"的判据
  #    ⟹ 严格说 `has_exact_fields` 应该是 false。但模型可能按"不确定就给 true"的规则给 true，
  #    两种都说得通，所以这里**不断言**。
  kind_note: has_exact_fields 两种取值都合理，故不设断言

- file: policy-page-01.jpg
  kind: 制度页（实拍纸张）
  # 「第 3.2 条 家具主体保修期为 24 个月」，满版 5 章节，不是"一句话"
  must_have: ["3.2", "24个月"]
  # 图里没有 6 位以上连续数字、没有条码、没有单号 ⟹ 判据下应为 false（第一版我写错了）
  has_exact_fields: false

- file: screen-noise-01.jpg
  kind: 拍屏（反光 + 摩尔纹）
  # 「已发货，预计 3 天内送达」。字很清楚，噪声主要在画面上半部分。
  must_have: ["已发货", "3天内"]
  has_exact_fields: false

# ---------------------------------------------------------------- 无文字的图（只有 scene）

- file: box-damaged-01.jpg
  kind: 破损纸箱（实拍/生成）
  scene_any: ["纸箱", "包裹", "箱"]
  must_have: []
  has_exact_fields: false
  question: "这个还能退吗？"
  required_points:
    - "48 小时内报障"
    - "外箱六面照片"
    - "不要自行丢弃破损件"

- file: chair-broken-01.jpg
  kind: 家具损坏（实拍/生成）
  scene_any: ["椅", "断裂", "木"]
  must_have: []
  has_exact_fields: false
  question: "这个还没坏透，还能保修吗？"
  required_points:
    - "家具主体保修 2 年"
    - "保修优先维修或换新，不是直接退款"
