# 检索层题集：只判"该条款有没有被召回"
# 判定方式：must_hit 里的文档路径必须出现在 top-k 引用来源中（k=5，可调）。
# 写法要求：问句故意**不含政策关键词**（不出现"退货政策""保修期"这类词），
#          否则测的是关键词匹配，不是语义检索 —— 这正是本项目要验证的东西。
# 路径相对于 evals/corpus/senyu-home/

