# 抗干扰题集：同一个问题有多个"看起来对"的依据，必须选对那个
# 判定方式：correct 里的要点必须出现，且 wrong_source 里的答案**不得**出现。
# 五类干扰：历史版本 / 兄弟品牌线 / 未生效草案 / 内部口径 / 相邻概念。

- id: adv-01
  question: "无理由退货到底是 7 天还是 15 天？"
  correct: "现行总则 7 天（2023 版曾为 15 天，该版本已于 2025-12-31 废止）"
  wrong_source: "15 天"
  distractor_doc: "90-干扰-历史版本/01-2023版退货政策（已废止）.md"
  why: "语料里 15 天真实存在，但属于已废止版本。考'能不能分辨现行性'。"

- id: adv-02
  question: "家具保修是 1 年还是 2 年？"
  correct: "2 年（2023 版是 1 年，已废止；内部培训稿仍写 1 年，属过时口径）"
  wrong_source: "家具保修 1 年"
  distractor_doc: "90-干扰-历史版本/02-2023版保修条款（已废止）.md"
  why: "两个干扰源指向同一个错误答案：旧版 + 内部稿。"

- id: adv-03
  question: "破损要在多久内报？7 天还是 48 小时？"
  correct: "48 小时（内部培训稿写的 7 天是过时口径，官方是硬性 48 小时）"
  wrong_source: "7 天内报破损"
  distractor_doc: "93-干扰-内部FAQ/03-质检与报障判定标准（内部）.md"
  why: "内部稿写得很自信，但它早于官网 2026-01-01 改版。"

- id: adv-04
  question: "德国站无理由退货是几天？"
  correct: "14 天，且这是法定撤回权，不因商品是定制而排除"
  wrong_source: "30 天"
  distractor_doc: "93-干扰-内部FAQ/01-新客服入职手册·退换货篇.md"
  why: "内部手册把德国写成 30 天（与美国的 30 天混淆）。"

- id: adv-05
  question: "森屿 Lab 的东西能退多少天？"
  correct: "30 天（森屿 Lab 自己的政策），且须走 Lab 的售后入口，不适用主品牌的 7 天"
  wrong_source: "7 天"
  distractor_doc: "91-干扰-森屿Lab/02-森屿Lab退换货政策.md"
  why: "两个品牌政策不同；只用主品牌条款回答就是错的。"

- id: adv-06
  question: "我在森屿家居攒的积分，能用在森屿 Lab 的订单上吗？"
  correct: "不能，两个品牌积分体系独立、不互通"
  wrong_source: "可以通用"
  distractor_doc: "91-干扰-森屿Lab/01-森屿Lab品牌介绍.md"
  why: "最容易凭'同一个公司'联想答错。"

- id: adv-07
  question: "美国包邮门槛是多少，$49 还是 $59？"
  correct: "$59（2023 版是 $49，已废止）"
  wrong_source: "$49"
  distractor_doc: "90-干扰-历史版本/03-2023版运费与包邮（已废止）.md"
  why: "数字型干扰，且两个值都真实存在过。"

- id: adv-08
  question: "信用卡退款多久到账，3~5 天还是 7~10 天？"
  correct: "3~5 个工作日（2023 版写 7~10 天，已废止）"
  wrong_source: "7~10 个工作日"
  distractor_doc: "90-干扰-历史版本/04-2023版退款时效（已废止）.md"
  why: "旧版数字与新版只差一点点，靠语义相似度更容易召回旧版。"

- id: adv-09
  question: "英国站是不是很快要开了？"
  correct: "没有任何上线时间表；英国从未开通，预览稿明确未生效、不构成承诺"
  wrong_source: "即将开通 / 计划 14 天无理由"
  distractor_doc: "92-干扰-其他地区/01-英国站上线预览（未生效草案）.md"
  why: "草案里'拟 14 天'最容易被当成'已定'。"

- id: adv-10
  question: "东西用了一年半坏了，能直接退钱吗？"
  correct: "不能。先看保修：电子件 1 年（已过保）、家具主体 2 年（仍在保）→ 维修或换新，退款是最后手段"
  wrong_source: "可以按原价退款"
  distractor_doc: "40-服务/40-保修与维修.md"
  why: "考'保修 ≠ 退款'这条相邻概念的边界判定。"

- id: adv-11
  question: "你们跟木野家居比，谁的无理由退货更长？"
  correct: "只陈述森屿家居自己的政策，并说明内部培训材料里的对比不代表竞品官方政策、也不构成对外承诺"
  wrong_source: "木野是 7 天，我们是 30 天，所以我们更宽松"
  distractor_doc: "93-干扰-内部FAQ/06-竞品对比培训材料（内部）.md"
  why: "库里**确实有一句**竞品对比（内部材料），但它的性质是内部口径 —— 直接拿它下结论就是越过了依据的边界。"

