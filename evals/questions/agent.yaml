# agent 配对评测题集（阶段 7 · PLAN §13.4）
#
# 用法：uv run python evals/agent_paired.py            # 全跑（22 题 × 2 条路）
#       uv run python evals/agent_paired.py --repeat 3 # 模型非确定性 ⇒ 报数必须跑 3 轮
#       uv run python evals/agent_paired.py --limit 3  # 先试水
#
# ⚠️ **难度必须加在 agent 的轴上**，不是"更难的检索题"：
#    · multi_hop      一句话要**两个不同文档**的事实（跨文档 / 总则 vs 例外），
#                     一次检索大概率只捞到一边 ⟹ 需要**多步检索**
#    · multi_intent   一句话两个诉求（同一主题域内，pipeline 也可能一次捞全）
#    · insufficient   缺关键信息，正确行为是**反问**（pipeline 只会硬答或硬拒）
#    · single_hop     对照组 —— pipeline 本来就强，agent **不许明显退化**
#
# ⚠️ 每条要点都**机器可核对**（数字＋单位 / 拉丁词硬命中，中文看二元组覆盖），
#    判定器复用 `evals/run.py::_point_hit`，不另写一套。
#
# ⚠️ `expect_tools` 是**人工金标准轨迹**，只用来算"工具选择准确率"，
#    不参与"答对没答对"。轨迹对了但答案错，和轨迹错但碰巧答对，是两件事。
#    `min_search` 只用于统计"这道题它是否真的检索了 ≥N 次"（多步行为的证据）。

# ---------------- 多跳（6）：跨文档 / 总则 vs 例外，一次检索不够 ----------------
#
# 📌 **2026-10-26 重写（W19 结案）**：这 6 题原来是"不发单号、看你敢不敢用近期订单推断"，
#    实测把 agent 逼进 `ask_user`（终止工具）—— 一组题同时测了两件事，结论没法归因。
#    现在改成**内部坐席侧的多步检索题**：不带单号、不涉及顾客身份、不用 `get_order`，
#    要的是"这句话里的两个事实分别在哪两份文档里"。
#    取舍与数字 → `CANDIDATES.md` W19、`docs/architecture.md` §9.51。

- id: A01
  kind: multi_hop
  question: "日本站顾客用便利店支付买的，无理由退货有几天？退款多久能到账？"
  # 8 天在《地区差异》，7~15 个工作日（本地钱包）在《退换货总则》—— 两份文档
  required_points: ["8 天", "7~15 个工作日"]
  expect_tools: ["search_kb"]
  min_search: 2

- id: A02
  kind: multi_hop
  question: "德国顾客的刻字遮光帘已经上门装好了，现在想撤回，可以吗？拆装费用谁承担？"
  # 总则说"定制类不支持无理由"，德国站是**例外**（14 天法定撤回权不因定制而排除）
  # ⟹ 答对必须同时找到"总则的排除"和"地区差异的例外"，只捞一边就会答错
  required_points: ["14 天", "拆装"]
  expect_tools: ["search_kb"]
  min_search: 2

- id: A03
  kind: multi_hop
  question: "顾客的床架装好 4 个月后开始晃，这是走安装质保还是走保修？"
  # 安装质保 90 天（《安装服务》）已过 ⟹ 转《保修与维修》，家具主体 2 年
  required_points: ["90 天", "2 年"]
  expect_tools: ["search_kb"]
  min_search: 2

- id: A04
  kind: multi_hop
  question: "顾客收货第 5 天才来报外箱破损，一线客服能直接受理吗？"
  # 报障时限 48 小时在《物流时效与运费》，"超时只能售后主管审批"在《安装服务与客服 SLA》
  required_points: ["48 小时", "售后主管"]
  expect_tools: ["search_kb"]
  min_search: 2

- id: A05
  kind: multi_hop
  question: "日本站顾客全额用积分抵扣买的，关税还要他付吗？退款时积分怎么退？"
  # 税费归属在《关税与清关》（积分抵扣不改变归属），积分退回顺序在《会员与积分》
  required_points: ["关税", "30 天"]
  expect_tools: ["search_kb"]
  min_search: 2

- id: A06
  kind: multi_hop
  question: "美国站一单实付 45 美元想无理由退货，退回运费谁出？如果顾客是金卡会员呢？"
  # $59 门槛在《地区差异》，金卡前 3 次补贴在《退换货总则》/《会员与积分》
  required_points: ["59", "金卡"]
  expect_tools: ["search_kb"]
  min_search: 2

# ---------------- 多诉求（5）：一句话两个问题，要一步查完 ---------------
- id: B01
  kind: multi_intent
  question: "SF10001 能退吗？顺便问下这床架保修多久。"
  required_points: ["7 天", "2 年"]
  expect_tools: ["get_order", "search_kb"]

- id: B02
  kind: multi_intent
  question: "退款多久能到账？退回的运费谁出？"
  required_points: ["工作日", "运费"]
  expect_tools: ["search_kb"]

- id: B03
  kind: multi_intent
  question: "德国客户能退货吗？退货运费要自己付吗？"
  required_points: ["14 天", "运费"]
  expect_tools: ["search_kb"]

- id: B04
  kind: multi_intent
  question: "会员积分怎么算？能抵现金吗？"
  required_points: ["1%", "20%"]
  expect_tools: ["search_kb"]

- id: B05
  kind: multi_intent
  question: "上门安装要多少钱？临时改期收不收费？"
  required_points: ["99", "50"]
  expect_tools: ["search_kb"]

# ---------------- 信息不足（5）：正确行为是反问**一次** ---------------
#
# 📌 这一组是**主指标**（`PLAN §13.4` 验收标准①）：pipeline 结构上做不到反问，
#    只能硬答或硬拒；agent 的 `ask_user` 正是为它存在的。
#    真实客服里这也是最常见的一句 ——「我要退款」不说单号。

- id: C01
  kind: insufficient
  question: "我退款怎么还没到账？"
  expect_clarify: true

- id: C02
  kind: insufficient
  question: "这个能退吗？"
  expect_clarify: true

- id: C03
  kind: insufficient
  question: "东西坏了怎么办？"
  expect_clarify: true

- id: C04
  kind: insufficient
  question: "运费多少？"
  expect_clarify: true

- id: C05
  kind: insufficient
  question: "保修还有多久？"
  expect_clarify: true

