# ---------------- 信息不足（15）：正确行为是反问**一次** ---------------
#
# 📌 这一组是**主指标**（`PLAN §13.4` 验收标准①）：pipeline 结构上做不到反问，
#    只能硬答或硬拒；agent 的 `ask_user` 正是为它存在的。
#    真实客服里这也是最常见的一句 ——「我要退款」不说单号。
#
# ⚠️ **2026-10-26 从 5 题扩到 15 题**：5 题时一题就值 20 pt，+20 和 +40 只是
#    "同一道题三次里对了两次还是一次"的差别 —— 那种数字不能写进任何结论。
# ⚠️ 每道题都必须**真的缺关键信息**（缺单号 / 缺站点 / 缺商品或时间）。
#    如果某题其实查得到答案，那"没反问"就不该算错 —— 那样会冤枉模型。
#    每题的"缺什么"写在题上，方便以后复核。

- id: C01
  kind: insufficient
  question: "我退款怎么还没到账？"
  # 缺：哪一单（没单号）+ 什么支付方式
  expect_clarify: true

- id: C02
  kind: insufficient
  question: "这个能退吗？"
  # 缺：什么商品 / 哪一单 / 为什么不想要
  expect_clarify: true

- id: C03
  kind: insufficient
  question: "东西坏了怎么办？"
  # 缺：什么坏了 + 坏成什么样（质量问题还是人为）
  expect_clarify: true

- id: C04
  kind: insufficient
  question: "运费多少？"
  # 缺：哪个站点（四站门槛/运费都不同）
  expect_clarify: true

- id: C05
  kind: insufficient
  question: "保修还有多久？"
  # 缺：什么商品 + 什么时候签收
  expect_clarify: true

- id: C06
  kind: insufficient
  question: "我这单到哪了？"
  # 缺：单号（顾客说"这单"，但我们并不知道是哪一单）
  expect_clarify: true

- id: C07
  kind: insufficient
  question: "东西什么时候能送到？"
  # 缺：发到哪个站点（时效按站点分四档）
  expect_clarify: true

- id: C08
  kind: insufficient
  question: "我这个能换个颜色吗？"
  # 缺：哪一单 / 什么商品 / 已经收货了没有
  expect_clarify: true

- id: C09
  kind: insufficient
  question: "坏成这样还能换新的吗？"
  # 缺：什么商品 + 坏的原因（换新只走质量/保修，人为损坏不保）
  expect_clarify: true

- id: C10
  kind: insufficient
  question: "退款的时候扣了我多少运费？"
  # 缺：哪一单（扣多少取决于订单金额、会员等级、是否质量问题）
  expect_clarify: true

- id: C11
  kind: insufficient
  question: "买多少才能包邮？"
  # 缺：哪个站点（$59 / €69 / ¥8000 / S$80）
  expect_clarify: true

- id: C12
  kind: insufficient
  question: "我这东西过保了吗？"
  # 缺：什么商品（部件不同、期限不同）+ 签收时间
  expect_clarify: true

- id: C13
  kind: insufficient
  question: "我的积分怎么少了？"
  # 缺：哪个账号 / 哪一笔订单
  expect_clarify: true

- id: C14
  kind: insufficient
  question: "能帮我改一下收货地址吗？"
  # 缺：哪一单 / 改到哪（且已出库的能不能改要按状态判断）
  expect_clarify: true

- id: C15
  kind: insufficient
  question: "能补个差价吗？"
  # 缺：哪一单 + 什么时候下单（价格保护只有 7 天，且有四种不适用情形）
  expect_clarify: true

