# 生成层题集：判"答案要点齐不齐 + 引用指得对不对"
# 判定方式：required_points 全部命中（语义等价即可）＋ must_cite 至少一个命中引用来源
#          ＋ must_not_say 一条都不许出现（这些是"答错"的典型症状）。
# 注意：**不判文风**，只判事实与引用。

- id: gen-01
  question: "退货有多少天？"
  required_points:
    - "总则 7 天（自签收起算）"
    - "美国 30 天"
    - "德国 14 天法定撤回权"
    - "日本 8 天"
  must_cite: ["10-退换货/10-退换货总则.md", "10-退换货/11-地区差异.md"]
  must_not_say: ["退货统一 30 天", "所有地区都是 7 天"]

- id: gen-02
  question: "德国客户买了刻字商品，能撤回吗？"
  required_points:
    - "能，14 天法定撤回权"
    - "定制排除条款不适用于德国"
    - "顾客承担退回运费，且不得收附加手续费"
  must_cite: ["10-退换货/11-地区差异.md"]
  must_not_say: ["定制商品一律不退"]

- id: gen-03
  question: "从签收到退款到账，我多久能拿到钱？"
  required_points:
    - "先走审核 48 小时 + 仓库质检 3 个工作日"
    - "信用卡/PayPal 3~5 个工作日"
    - "本地钱包与银行转账 7~15 个工作日"
  must_cite: ["10-退换货/10-退换货总则.md"]
  must_not_say: ["7~10 个工作日"]

- id: gen-04
  question: "保修期各部件分别多久？"
  required_points:
    - "家具主体 2 年"
    - "电子件 1 年"
    - "布艺与填充件 6 个月"
    - "五金件 6 个月"
  must_cite: ["40-服务/40-保修与维修.md"]
  must_not_say: ["保修统一 1 年", "家具保修 1 年"]

- id: gen-05
  question: "保修期内坏了能直接退款吗？"
  required_points:
    - "不能，退款是最后手段"
    - "顺序：先维修 → 无法维修换新 → 无同款才退款"
    - "使用超过 1 年的按每年 20% 折旧后退款"
  must_cite: ["40-服务/40-保修与维修.md"]
  must_not_say: ["可以随时要求退款"]

- id: gen-06
  question: "哪些情况不保修？"
  required_points:
    - "人为损坏"
    - "自然耗损"
    - "非官方渠道购买（保修随订单不随商品）"
    - "自行拆装或改装"
    - "跨境运输损坏不算人为，走破损报障"
  must_cite: ["40-服务/40-保修与维修.md"]
  must_not_say: ["只要是我们的产品都保修"]

- id: gen-07
  question: "外箱破了，我该在多久内报？要准备什么？"
  required_points:
    - "签收后 48 小时内"
    - "外箱六面照片 + 商品照片"
    - "开箱视频 ≥15 秒"
    - "不要自行丢弃破损件"
  must_cite: ["20-物流与税费/20-物流时效与运费.md"]
  must_not_say: ["7 天内可以报", "一个月内"]

- id: gen-08
  question: "关税谁付？"
  required_points:
    - "美国、德国 DDP，顾客收件不再付费"
    - "日本、新加坡、马来西亚 DDU，顾客缴税"
    - "税费归属按收货地址判定"
    - "实际税额以海关核定为准，多不退少不补"
  must_cite: ["20-物流与税费/21-关税与清关.md"]
  must_not_say: ["全球包税", "所有地区都是 DDP"]

- id: gen-09
  question: "包邮门槛是多少？"
  required_points:
    - "美国 $59 / 德国 €69 / 日本 ¥8000 / 新马 S$80"
    - "按扣除优惠券与积分后的实付金额判定"
    - "包邮仅指标准配送，加急差价自付"
    - "大件家具一律不包邮"
  must_cite: ["20-物流与税费/20-物流时效与运费.md"]
  must_not_say: ["美国 $49 包邮"]

- id: gen-10
  question: "各站点配送要多久？"
  required_points:
    - "美国 7~12 天"
    - "德国 10~18 天"
    - "日本 5~9 天"
    - "新马 4~8 天"
    - "旺季（11/20–12/25）顺延 3~5 天不算超时"
  must_cite: ["20-物流与税费/20-物流时效与运费.md"]
  must_not_say: ["全球 3~5 天送达"]

- id: gen-11
  question: "会员等级怎么算，积分有什么用？"
  required_points:
    - "银卡年累计实付 ≥$500，金卡 ≥$1500"
    - "积分比例 1% / 3% / 5%"
    - "单笔最多抵扣 20%"
    - "积分有效期 12 个月"
    - "积分不可提现、不可转让"
  must_cite: ["30-会员与营销/30-会员与积分.md"]
  must_not_say: ["积分可以折现", "积分永久有效"]

- id: gen-12
  question: "退款时积分怎么处理？"
  required_points:
    - "先退回本次使用的积分（延长 30 天）"
    - "再退现金部分"
    - "该订单新增的积分一并扣回"
  must_cite: ["30-会员与营销/30-会员与积分.md"]
  must_not_say: ["积分一律作废"]

- id: gen-13
  question: "优惠券有哪些限制？"
  required_points:
    - "不可叠加（金额券/折扣券/免邮券互斥）"
    - "不与会员价同享"
    - "过期不退不补"
    - "退款不退券，缺货全额退款例外"
  must_cite: ["30-会员与营销/31-优惠券与促销.md"]
  must_not_say: ["可以叠加使用"]

- id: gen-14
  question: "安装服务覆盖哪里，收多少钱？"
  required_points:
    - "共 32 个城市，结算页按地址校验"
    - "99 / 199 / 299 元三档（有电梯单件 / 无电梯 / 多件或拆旧）"
    - "拆旧清运、墙体打孔加固、非标改装另收"
    - "改期需提前 48 小时，48 小时内改期收 50 元空跑费"
  must_cite: ["40-服务/41-安装服务与客服SLA.md"]
  must_not_say: ["全国免费安装"]

- id: gen-15
  question: "客服多久回复我？"
  required_points:
    - "在线客服工作日 09:00–21:00、周末 10:00–18:00"
    - "首次响应 2 小时；邮箱 48 小时；紧急队列 30 分钟"
    - "节假日可能延长至 24 小时"
  must_cite: ["40-服务/41-安装服务与客服SLA.md"]
  must_not_say: ["7×24 小时随时回复"]

- id: gen-16
  question: "我对客服结论不满意，能往上投诉吗？"
  required_points:
    - "三级：一线客服 → 售后主管 → 争议处理"
    - "争议流程 7 个工作日内给书面结论"
    - "超时报障只能由售后主管审批，一线无权放行"
  must_cite: ["40-服务/41-安装服务与客服SLA.md"]
  must_not_say: ["客服说了算，没有申诉"]

- id: gen-17
  question: "你们服务哪些国家？"
  required_points:
    - "美国、德国、日本、新加坡、马来西亚"
    - "英国、加拿大、澳大利亚、新西兰未开通"
    - "未开通地区没有生效政策，站外流传的是早期预览稿"
  must_cite: ["00-公司概览.md", "10-退换货/11-地区差异.md"]
  must_not_say: ["全球发货", "英国站已上线"]

- id: gen-18
  question: "退货运费到底谁出？"
  required_points:
    - "质量问题/错发：商家承担"
    - "无理由：顾客承担"
    - "金卡每年前 3 次无理由退回运费补贴"
    - "美国订单 ≥$59 无理由退回运费由商家承担"
    - "德国法定撤回：顾客承担，但不得收附加手续费"
  must_cite: ["10-退换货/10-退换货总则.md", "10-退换货/11-地区差异.md"]
  must_not_say: ["退货一律免运费"]

- id: gen-19
  question: "为什么我下单时付了运费，收件还要交税？"
  required_points:
    - "运费与关税是两件事"
    - "该站点为 DDU，报价不含关税"
    - "用积分抵扣也不改变税费归属"
  must_cite: ["20-物流与税费/21-关税与清关.md"]
  must_not_say: ["运费里已含关税"]

- id: gen-20
  question: "质量问题的退换窗口和保修期是一回事吗？"
  required_points:
    - "不是一回事"
    - "质量问题退换 30 天内"
    - "超过 30 天转保修（最长 2 年／电子件 1 年）"
    - "保修结果不是退款，是维修或换新"
  must_cite: ["94-干扰-相邻概念/01-保修与退换货的区别.md", "40-服务/40-保修与维修.md"]
  must_not_say: ["30 天后还能直接退款"]
