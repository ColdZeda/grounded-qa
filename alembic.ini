# ============================================================
# Alembic configuration
# ------------------------------------------------------------
# WARNING: THIS FILE MUST STAY **PURE ASCII**. Do not write
# Chinese (or any non-ASCII) text here -- not even in comments.
#
#   Alembic reads this file with `encoding="locale"`
#   (see alembic/util/compat.py -> configparser.read(..., encoding="locale")).
#   On a Chinese Windows box the locale encoding is GBK, so a UTF-8
#   Chinese comment raises:
#       UnicodeDecodeError: 'gbk' codec can't decode byte 0x80 ...
#   ...and `alembic` dies before it even connects to the database.
#   On Linux (C.UTF-8) the very same file works -- so this bug shows up
#   ONLY on the dev machine, never on the server. See AGENTS.md section 10.
#
# NOTE: sqlalchemy.url is deliberately absent. migrations/env.py reads the
#       connection string from app.core.config (single source of truth), so
#       editing .env can never leave the migration tool pointing at an old DB.
# ============================================================
[alembic]
script_location = migrations
prepend_sys_path = .
# Migration filenames are timestamp-prefixed: lexical order == execution order,
# which is far easier to read than bare hash prefixes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
version_path_separator = os
timezone = Asia/Shanghai

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
