# ============================================================
# 部署：构建镜像 → 推 ACR → SSH 到服务器 pull → **执行迁移 + seed** → 健康检查 → 失败自动回滚
# ------------------------------------------------------------
# 触发：推送到 main，或手动触发。
#
# ⚠️ 硬约束（AGENTS 硬约束 §2.4）：
#    **镜像在 CI 构建 → 推 ACR → 服务器只 pull。**
#    绝不在 2C2G 服务器上 docker build（必 OOM）。
#
# ⚠️ 镜像标签用 commit SHA，**不用 latest**（硬约束 §2.6）。
#
# 需要的仓库 Secrets
# （⚠️ 密码 / 私钥**只从 GitHub 界面填**：Settings → Secrets and variables → Actions。
#   绝不贴进对话、绝不提交进仓库。）
#    ACR_REGISTRY      ⚠️ **含命名空间**，不是纯域名。
#                      例：crpi-xxxxxxxxxxxx.cn-shenzhen.personal.cr.aliyuncs.com/grounded-qa
#                      理由：下面的镜像名写的是 `$ACR_REGISTRY/grounded-qa-api`，
#                            拼出来正好等于阿里云控制台给的推送地址。
#                      ⚠️ **新版个人版**实例的域名形如
#                            `crpi-xxxx.cn-shenzhen.personal.cr.aliyuncs.com`（**`crpi-`**，不是 `cri-`）；
#                            `registry.cn-shenzhen.aliyuncs.com` 是**旧版 / 企业版**的写法。
#                            填错会推到不存在的仓库 —— 好在它会**报错**，不会静默。
#                      📌 但 **`docker login` 要的是【纯域名】**（不带 `/grounded-qa`）——
#                         所以 workflow 里用 `${ACR_REGISTRY%%/*}` 现剥一个 `ACR_HOST` 出来，
#                         **不另存第 8 个 secret**。见 B5。
#    ACR_USERNAME      阿里云 ACR **用户名**（不是密码，形如 `aliyun0490812142`）
#    ACR_PASSWORD      ACR 的 Registry 登录密码（控制台里单独设的那个）
#    SSH_HOST          服务器地址
#    SSH_USER          登录用户（root）
#    SSH_KEY           部署**专用**私钥（新生成一对，别复用你的登录私钥）
#    SSH_KNOWN_HOSTS   ssh-keyscan 得到的 known_hosts 内容
# ============================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 部署不能并发，否则回滚点会互相覆盖
  group: deploy-production
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}
  REMOTE_DIR: /opt/grounded-qa
  # ⚠️ 生产 compose 放在**仓库根**（不是 deploy/）：
  #    compose 里的相对路径是按**该文件所在目录**解析的，
  #    放根目录才能让 ./deploy/prometheus/... 与 .env 在本地和服务器上解析一致。
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  # ------------------------------------------------------------
  # 1. 构建并推送镜像
  # ------------------------------------------------------------
  build-and-push:
    name: 构建并推送镜像到 ACR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 从 ACR_REGISTRY 剥出「纯域名」
        # ⚠️ **`docker login` 要的是【纯域名】，不带命名空间。**
        #    阿里云「操作指南」给的官方示例就是
        #      `docker login --username=… crpi-xxx….aliyuncs.com`
        #    而 `ACR_REGISTRY` 里**含** `/grounded-qa`（拼镜像名要用它）→ **两个用途必须分开**：
        #      · **登录** → 用剥出来的 `ACR_HOST`
        #      · **拼镜像名** → 用原值 `ACR_REGISTRY`
        # 📌 为什么不拆成第 8 个 secret（B5 的老方案）：**能算出来的东西不要另存一份** ——
        #    多一个 secret 就多一处要手工同步，而两处迟早会悄悄不一致。
        run: echo "ACR_HOST=${ACR_REGISTRY%%/*}" >> "$GITHUB_ENV"

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送 api 镜像
        run: |
          set -euo pipefail
          image="$ACR_REGISTRY/grounded-qa-api:$IMAGE_TAG"
          docker build -t "$image" .
          docker push "$image"

      - name: 构建并推送 nginx 镜像（含前端产物）
        run: |
          set -euo pipefail
          image="$ACR_REGISTRY/grounded-qa-nginx:$IMAGE_TAG"
          docker build -f deploy/nginx/Dockerfile -t "$image" .
          docker push "$image"

  # ------------------------------------------------------------
  # 2. 部署 + 健康检查 + 失败回滚
  # ------------------------------------------------------------
  deploy:
    name: 部署到服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host target
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
          EOF

      - name: 同步 compose / nginx / prometheus 配置到服务器
        run: |
          set -euo pipefail
          ssh target "mkdir -p $REMOTE_DIR/deploy/nginx $REMOTE_DIR/deploy/prometheus"
          scp docker-compose.prod.yml        target:$REMOTE_DIR/docker-compose.prod.yml
          scp deploy/nginx/grounded-qa.conf  target:$REMOTE_DIR/deploy/nginx/grounded-qa.conf
          scp deploy/prometheus/prometheus.yml target:$REMOTE_DIR/deploy/prometheus/prometheus.yml
          echo "ℹ️ 服务器上的 .env 由人工维护，CI 绝不覆盖（每个环境一份独立 .env）"

      - name: 记录回滚点（当前版本标签）
        id: prev
        run: |
          set -euo pipefail
          prev="$(ssh target "cat $REMOTE_DIR/.current_tag 2>/dev/null || true")"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "回滚点：${prev:-（空，首次部署）}"

      - name: 服务器侧登录 ACR
        # ⚠️ **这一步不能省。**
        #    两个镜像仓库都是**私有**的，而服务器**从没登录过** ——
        #    上面 `build-and-push` 里那次 `docker login` 发生在 **GitHub 的 runner** 上，
        #    跟服务器是两台机器、两套 docker 凭据，一点关系都没有。
        #    少了它，第一次部署会在 `compose pull` 上 `unauthorized`
        #    → 触发自动回滚 → 而首次部署**又没有回滚点** → 只能人工介入。
        #    （回滚那一步的 `compose up -d` 如果本地没有旧镜像也会去 pull，同样吃这一步。）
        #
        # ⚠️ 密码走 **stdin**（`--password-stdin`）：不进 argv、不进进程列表、不进日志。
        #    经 `env:` 传入而不是把 `${{ secrets.* }}` 插值进脚本文本 ——
        #    后者在密码含引号 / 反引号时会被 shell 解释，也更容易被日志捞到。
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          # ⚠️ 与 build-and-push 那一步同一个道理：**登录用纯域名**，不是含命名空间的原值。
          #    在这里剥一次再传过去 —— 服务器上就不必再写一遍同样的逻辑。
          ACR_HOST="${ACR_REGISTRY%%/*}"
          printf '%s' "$ACR_PASSWORD" | ssh target \
            "docker login '$ACR_HOST' --username='${{ secrets.ACR_USERNAME }}' --password-stdin"

      - name: 拉取新镜像并重启
        run: |
          set -euo pipefail
          ssh target "cd $REMOTE_DIR && \
            ACR_REGISTRY='$ACR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' \
            docker compose -f $COMPOSE_FILE pull && \
            ACR_REGISTRY='$ACR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' \
            docker compose -f $COMPOSE_FILE up -d --remove-orphans"

      # ------------------------------------------------------------
      # ⚠️ **迁移与 seed 为什么必须由 CI 跑**（2026-10-17 补）
      #
      #    原来这条链里**没有**这两步 —— 而 `Dockerfile` 的 CMD 只有 uvicorn，
      #    数据库表不会自己长出来。后果是**最坏的那种**：
      #
      #        .env 建好 → up -d 成功 → /healthz 返回 200 → 部署"绿了"
      #                                              ↓
      #                                 users 表不存在 → 登录 500
      #
      #    `/healthz` **故意不查数据库**（`app/main.py` 写了理由：避免依赖抖动引发无谓重启），
      #    所以**它绿 ≠ 能用**。把迁移放在"健康检查之前"，这个绿才有意义。
      #
      # 📌 两步都**幂等**，所以每次部署都跑是安全的：
      #    · `alembic upgrade head`：跑过的迁移记在 `alembic_version` 表里，会跳过
      #    · `app.db.seed`：按邮箱查，已存在就**完全不动**（尤其**不覆盖改过的密码**）
      #
      # ⚠️ 用 `run --rm --no-deps` 而**不是** `exec`：
      #    `exec` 要求 api 容器**已经在跑**，而 `up -d` 返回时它可能还在 "Created"，
      #    存在竞态。`run` 起一个一次性容器跑完就删，不依赖 api 的启动状态。
      #    加 `--no-deps` 是因为 postgres 已经由上面的 `up -d` 起好了。
      #
      # ⚠️ **回滚不动数据库**：迁移是「向前单行道」。万一这次部署失败回滚到旧镜像，
      #    库里已经是新 schema —— 老代码遇到多出来的列/表通常无害，但**反向不成立**。
      #    这是刻意的取舍（写 downgrade 的收益远小于风险），不是漏了。
      # ------------------------------------------------------------
      - name: 执行数据库迁移（幂等）
        run: |
          set -euo pipefail
          ssh target "cd $REMOTE_DIR && \
            ACR_REGISTRY='$ACR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' \
            docker compose -f $COMPOSE_FILE run --rm --no-deps api alembic upgrade head"

      - name: 建默认租户与管理员（幂等）
        run: |
          set -euo pipefail
          ssh target "cd $REMOTE_DIR && \
            ACR_REGISTRY='$ACR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' \
            docker compose -f $COMPOSE_FILE run --rm --no-deps api python -m app.db.seed"

      - name: 轮询 /healthz
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if ssh target "curl -fsS http://127.0.0.1:8080/healthz" > /dev/null 2>&1; then
              echo "✅ 第 ${i} 次探测通过"
              exit 0
            fi
            echo "…第 ${i} 次未通过，5s 后重试"
            sleep 5
          done
          echo "❌ 健康检查超时"
          exit 1

      - name: 部署成功 → 记录当前版本
        if: success()
        run: |
          set -euo pipefail
          ssh target "printf '%s\n' '$IMAGE_TAG' > $REMOTE_DIR/.current_tag"
          echo "已记录当前版本：$IMAGE_TAG"

      - name: 部署失败 → 自动回滚
        if: failure()
        run: |
          set -euo pipefail
          prev='${{ steps.prev.outputs.tag }}'
          if [ -z "$prev" ]; then
            echo "⚠️ 没有可回滚的版本（首次部署），请人工介入"
            ssh target "cd $REMOTE_DIR && docker compose -f $COMPOSE_FILE ps" || true
            exit 1
          fi
          echo "开始回滚到：$prev"
          ssh target "cd $REMOTE_DIR && \
            ACR_REGISTRY='$ACR_REGISTRY' IMAGE_TAG='$prev' \
            docker compose -f $COMPOSE_FILE up -d --remove-orphans"
          ssh target "curl -fsS http://127.0.0.1:8080/healthz" \
            && echo "✅ 回滚成功" \
            || { echo "❌ 回滚后仍不健康，请立即人工介入"; exit 1; }

      - name: 失败时导出容器日志
        if: failure()
        run: |
          ssh target "cd $REMOTE_DIR && docker compose -f $COMPOSE_FILE logs --tail=200" || true
