# ============================================================
# 部署：构建镜像 → 推 ACR → SSH 到服务器 pull → **执行迁移 + seed** → 健康检查 → 失败自动回滚
# ------------------------------------------------------------
# 触发：推送到 main，或手动触发。
#
# ⚠️ 硬约束（AGENTS 硬约束 §2.4）：
#    **镜像在 CI 构建 → 推 ACR → 服务器只 pull。**
#    绝不在 2C2G 服务器上 docker build（必 OOM）。
#
# ⚠️ 镜像标签用 commit SHA，**不用 latest**（硬约束 §2.6）。
#
# 需要的仓库 Secrets
# （⚠️ 密码 / 私钥**只从 GitHub 界面填**：Settings → Secrets and variables → Actions。
#   绝不贴进对话、绝不提交进仓库。）
#    ACR_REGISTRY      ⚠️ **含命名空间**，不是纯域名。
#                      例：crpi-xxxxxxxxxxxx.cn-shenzhen.personal.cr.aliyuncs.com/grounded-qa
#                      理由：下面的镜像名写的是 `$ACR_REGISTRY/grounded-qa-api`，
#                            拼出来正好等于阿里云控制台给的推送地址。
#                      ⚠️ **新版个人版**实例的域名形如
#                            `crpi-xxxx.cn-shenzhen.personal.cr.aliyuncs.com`（**`crpi-`**，不是 `cri-`）；
#                            `registry.cn-shenzhen.aliyuncs.com` 是**旧版 / 企业版**的写法。
#                            填错会推到不存在的仓库 —— 好在它会**报错**，不会静默。
#                      📌 但 **`docker login` 要的是【纯域名】**（不带 `/grounded-qa`）——
#                         所以 workflow 里用 `${ACR_REGISTRY%%/*}` 现剥一个 `ACR_HOST` 出来，
#                         **不另存第 8 个 secret**。见 B5。
#    ACR_USERNAME      阿里云 ACR **用户名**（不是密码，形如 `aliyun0490812142`）
#    ACR_PASSWORD      ACR 的 Registry 登录密码（控制台里单独设的那个）
#    SSH_HOST          服务器地址
#    SSH_USER          登录用户（root）
#    SSH_KEY           部署**专用**私钥（新生成一对，别复用你的登录私钥）
#    SSH_KNOWN_HOSTS   ssh-keyscan 得到的 known_hosts 内容
# ============================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 部署不能并发，否则回滚点会互相覆盖
  group: deploy-production
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}
  REMOTE_DIR: /opt/grounded-qa
  # ⚠️ 生产 compose 放在**仓库根**（不是 deploy/）：
  #    compose 里的相对路径是按**该文件所在目录**解析的，
  #    放根目录才能让 ./deploy/prometheus/... 与 .env 在本地和服务器上解析一致。
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  # ------------------------------------------------------------
  # 1. 构建并推送镜像
  # ------------------------------------------------------------
  build-and-push:
    name: 构建并推送镜像到 ACR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 从 ACR_REGISTRY 剥出「纯域名」
        # ⚠️ **`docker login` 要的是【纯域名】，不带命名空间。**
        #    阿里云「操作指南」给的官方示例就是
        #      `docker login --username=… crpi-xxx….aliyuncs.com`
        #    而 `ACR_REGISTRY` 里**含** `/grounded-qa`（拼镜像名要用它）→ **两个用途必须分开**：
        #      · **登录** → 用剥出来的 `ACR_HOST`
        #      · **拼镜像名** → 用原值 `ACR_REGISTRY`
        # 📌 为什么不拆成第 8 个 secret（B5 的老方案）：**能算出来的东西不要另存一份** ——
        #    多一个 secret 就多一处要手工同步，而两处迟早会悄悄不一致。
        run: echo "ACR_HOST=${ACR_REGISTRY%%/*}" >> "$GITHUB_ENV"

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送 api 镜像
        run: |
          set -euo pipefail
          image="$ACR_REGISTRY/grounded-qa-api:$IMAGE_TAG"
          docker build -t "$image" .
          docker push "$image"

      - name: 构建并推送 nginx 镜像（含前端产物）
        run: |
          set -euo pipefail
          image="$ACR_REGISTRY/grounded-qa-nginx:$IMAGE_TAG"
          docker build -f deploy/nginx/Dockerfile -t "$image" .
          docker push "$image"

      - name: 把公共基础镜像补进 ACR（幂等）
        # ⚠️ **为什么需要这一步**（2026-10-17 首次部署的血）：
        #    `docker-compose.prod.yml` 里 postgres / redis **也指向 ACR** 了。
        #    原因：服务器拉不到 Docker Hub，而加速器 `5haml59c.mirror.aliyuncs.com`
        #    **没有 `pgvector/pgvector:0.8.0-pg16`（404）**，daocloud 对它 502。
        #    只 `docker tag` 到服务器本地**不管用** —— CD 是 `compose pull && up -d`，
        #    `pull` 照样按 `image:` 原名去 Docker Hub 拉 → 还在同一个地方红。
        #    ⟹ **「服务器只 pull ACR」这条硬约束，只有在"所有镜像都在 ACR 里"时才成立。**
        #
        # ⚠️ **幂等**：先试着从 ACR 拉一次，拉到了就跳过 ——
        #    否则每次部署都往 ACR 传 ~700 MB。升版本时改下面那张表即可（会重新推一次）。
        run: |
          set -euo pipefail
          while read -r src dst <&3; do
            [ -z "${src:-}" ] && continue
            if docker pull "$ACR_REGISTRY/$dst" >/dev/null 2>&1; then
              echo "✅ ACR 已有 $dst，跳过"
              continue
            fi
            echo "⬆️ 上游 $src → ACR $ACR_REGISTRY/$dst"
            docker pull   "$src"                    </dev/null
            docker tag    "$src" "$ACR_REGISTRY/$dst"
            docker push   "$ACR_REGISTRY/$dst"      </dev/null
          done 3<<'EOF'
          pgvector/pgvector:0.8.0-pg16   pgvector:0.8.0-pg16
          redis:7.4.1-alpine             redis:7.4.1-alpine
          prom/prometheus:v3.1.0         prometheus:v3.1.0
          prom/node-exporter:v1.8.2      node-exporter:v1.8.2
          EOF
          # 📌 `prometheus` / `node-exporter` 也在上面那张表里（2026-10-18 补，v1.1 第 0 步）：
          #    它们在 `monitoring` profile 里，v1.0 的 CD 不经过；**v1.1 起 CD 带
          #    `--profile monitoring` 了，所以必须先在 ACR 里备好** —— 顺序天然安全：
          #    这个 job 在 `deploy` job **之前**跑完，`compose pull` 时镜像已经在 ACR。

  # ------------------------------------------------------------
  # 2. 部署 + 健康检查 + 失败回滚
  # ------------------------------------------------------------
  deploy:
    name: 部署到服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host target
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking yes
          EOF

      - name: 同步 compose / nginx / prometheus / 运维脚本到服务器
        run: |
          set -euo pipefail
          ssh target "mkdir -p $REMOTE_DIR/deploy/nginx $REMOTE_DIR/deploy/prometheus $REMOTE_DIR/deploy/ops"
          scp docker-compose.prod.yml        target:$REMOTE_DIR/docker-compose.prod.yml
          scp deploy/nginx/grounded-qa.conf  target:$REMOTE_DIR/deploy/nginx/grounded-qa.conf
          scp deploy/prometheus/prometheus.yml target:$REMOTE_DIR/deploy/prometheus/prometheus.yml
          # ⚠️ 告警规则必须**和 prometheus.yml 同一次**过去：`rule_files:` 指向它，
          #    只传 prometheus.yml 的话 Prometheus 会因为找不到规则文件而**起不来**。
          scp deploy/prometheus/alerts.yml   target:$REMOTE_DIR/deploy/prometheus/alerts.yml
          # 运维脚本（备份 / 恢复演练 / 冲突体检）。它们由**服务器的 systemd timer** 调用，
          # 所以必须落在宿主机上，不能只待在镜像里；scp 不保留可执行位 ⟹ 补一次 chmod。
          # ⚠️ `deploy/systemd/*.unit` **不随 CD 同步**：unit 进 `/etc/systemd/system` 要
          #    `daemon-reload`，让每次部署悄悄改定时任务不是好事。它们在仓库里存档，
          #    安装/更新由人工 scp（步骤见 `..\ops\server-notes.md`）。
          scp deploy/ops/backup.sh deploy/ops/restore-drill.sh deploy/ops/conflicts-check.sh \
            target:$REMOTE_DIR/deploy/ops/
          ssh target "chmod +x $REMOTE_DIR/deploy/ops/*.sh"
          echo "ℹ️ 服务器上的 .env 由人工维护，CI 绝不覆盖（每个环境一份独立 .env）"

      - name: 记录回滚点（当前版本标签）
        id: prev
        run: |
          set -euo pipefail
          prev="$(ssh target "cat $REMOTE_DIR/.current_tag 2>/dev/null || true")"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
          echo "回滚点：${prev:-（空，首次部署）}"

      - name: 服务器侧登录 ACR
        # ⚠️ **这一步不能省。**
        #    两个镜像仓库都是**私有**的，而服务器**从没登录过** ——
        #    上面 `build-and-push` 里那次 `docker login` 发生在 **GitHub 的 runner** 上，
        #    跟服务器是两台机器、两套 docker 凭据，一点关系都没有。
        #    少了它，第一次部署会在 `compose pull` 上 `unauthorized`
        #    → 触发自动回滚 → 而首次部署**又没有回滚点** → 只能人工介入。
        #    （回滚那一步的 `compose up -d` 如果本地没有旧镜像也会去 pull，同样吃这一步。）
        #
        # ⚠️ 密码走 **stdin**（`--password-stdin`）：不进 argv、不进进程列表、不进日志。
        #    经 `env:` 传入而不是把 `${{ secrets.* }}` 插值进脚本文本 ——
        #    后者在密码含引号 / 反引号时会被 shell 解释，也更容易被日志捞到。
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          # ⚠️ 与 build-and-push 那一步同一个道理：**登录用纯域名**，不是含命名空间的原值。
          #    在这里剥一次再传过去 —— 服务器上就不必再写一遍同样的逻辑。
          ACR_HOST="${ACR_REGISTRY%%/*}"
          printf '%s' "$ACR_PASSWORD" | ssh target \
            "docker login '$ACR_HOST' --username='${{ secrets.ACR_USERNAME }}' --password-stdin"

      - name: 拉取新镜像并重启
        # ⚠️ **`--profile monitoring` 不能漏**（v1.1 第 0 步起）：
        #    `prometheus` / `node_exporter` 挂在 `monitoring` profile 下，
        #    不带这个 flag 时它们**不在本次操作的启用集合里** ——
        #    而 `--remove-orphans` 会把"不在集合里的容器"当孤儿清掉。
        #    结果就是：每次部署都顺手把监控干掉，而且日志里只有一行 orphans。
        # ⚠️ `--profile feishu` 同理（v1.2 第①项起）：**四处都要带**（pull / up / 回滚 / logs）。
        #    它默认 `FEISHU_ENABLED=false`，进程会**正常退出**，容器停在 `Exited (0)` ——
        #    这是预期状态，不是故障；`restart: on-failure` 保证不会被反复拉起。
        run: |
          set -euo pipefail
          ssh target "cd $REMOTE_DIR && \
            ACR_REGISTRY='$ACR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' \
            docker compose -f $COMPOSE_FILE --profile monitoring --profile feishu pull && \
            ACR_REGISTRY='$ACR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' \
            docker compose -f $COMPOSE_FILE --profile monitoring --profile feishu up -d --remove-orphans"

      # ------------------------------------------------------------
      # ⚠️ **迁移与 seed 为什么必须由 CI 跑**（2026-10-17 补）
      #
      #    原来这条链里**没有**这两步 —— 而 `Dockerfile` 的 CMD 只有 uvicorn，
      #    数据库表不会自己长出来。后果是**最坏的那种**：
      #
      #        .env 建好 → up -d 成功 → /healthz 返回 200 → 部署"绿了"
      #                                              ↓
      #                                 users 表不存在 → 登录 500
      #
      #    `/healthz` **故意不查数据库**（`app/main.py` 写了理由：避免依赖抖动引发无谓重启），
      #    所以**它绿 ≠ 能用**。把迁移放在"健康检查之前"，这个绿才有意义。
      #
      # 📌 两步都**幂等**，所以每次部署都跑是安全的：
      #    · `alembic upgrade head`：跑过的迁移记在 `alembic_version` 表里，会跳过
      #    · `app.db.seed`：按邮箱查，已存在就**完全不动**（尤其**不覆盖改过的密码**）
      #
      # ⚠️ 用 `run --rm --no-deps` 而**不是** `exec`：
      #    `exec` 要求 api 容器**已经在跑**，而 `up -d` 返回时它可能还在 "Created"，
      #    存在竞态。`run` 起一个一次性容器跑完就删，不依赖 api 的启动状态。
      #    加 `--no-deps` 是因为 postgres 已经由上面的 `up -d` 起好了。
      #
      # ⚠️ **回滚不动数据库**：迁移是「向前单行道」。万一这次部署失败回滚到旧镜像，
      #    库里已经是新 schema —— 老代码遇到多出来的列/表通常无害，但**反向不成立**。
      #    这是刻意的取舍（写 downgrade 的收益远小于风险），不是漏了。
      # ------------------------------------------------------------
      - name: 执行数据库迁移（幂等）
        run: |
          set -euo pipefail
          ssh target "cd $REMOTE_DIR && \
            ACR_REGISTRY='$ACR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' \
            docker compose -f $COMPOSE_FILE run --rm --no-deps api alembic upgrade head"

      - name: 建默认租户与管理员（幂等）
        run: |
          set -euo pipefail
          ssh target "cd $REMOTE_DIR && \
            ACR_REGISTRY='$ACR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' \
            docker compose -f $COMPOSE_FILE run --rm --no-deps api python -m app.db.seed"

      - name: 灌知识库（幂等）
        id: ingest
        # ⚠️ **为什么要放在部署链里**（2026-10-17 补）：
        #    生产库原本 `chunks = 0` —— 站点能登录、能拒答，但**答不了任何业务问题**。
        #    语料会随 api 镜像一起发布（见 Dockerfile 的 `COPY evals/corpus`），
        #    但**镜像里有 ≠ 库里有**：这一步才是真正把文本切块、嵌入、写进库。
        #
        # ⚠️ **幂等**：`ingest.py` 按 `(tenant_id, content_hash)` 判重，已入库的文件直接跳过。
        #    所以日常部署**不会重复调 embedding**（只有语料变了才花那点钱）。
        # ⚠️ **必须在 seed 之后**：ingest 要按 slug 找租户，租户不存在就会报错退出。
        #
        # ⚠️ **`PYTHONPATH=/app` 不能省**：镜像是 `uv sync --no-install-project` 装的，
        #    `app` 包**没进 venv**；跑 `python scripts/kb/ingest.py` 时 sys.path[0] 是
        #    脚本所在目录（/app/scripts/kb），**cwd 不在里面** → `import app` 直接
        #    ModuleNotFoundError。（uvicorn 能跑是因为它自己把 cwd 插进 sys.path。）
        run: |
          set -euo pipefail
          ssh target "cd $REMOTE_DIR && \
            ACR_REGISTRY='$ACR_REGISTRY' IMAGE_TAG='$IMAGE_TAG' \
            docker compose -f $COMPOSE_FILE run --rm --no-deps api \
              env PYTHONPATH=/app \
              python scripts/kb/ingest.py --kb senyu --path evals/corpus/senyu-home"

      - name: 轮询 /healthz
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if ssh target "curl -fsS http://127.0.0.1:8080/healthz" > /dev/null 2>&1; then
              echo "✅ 第 ${i} 次探测通过"
              exit 0
            fi
            echo "…第 ${i} 次未通过，5s 后重试"
            sleep 5
          done
          echo "❌ 健康检查超时"
          exit 1

      - name: 重启 Prometheus，让它真的读到新规则
        # ⚠️ **为什么必须有这一步**：`prometheus.yml` / `alerts.yml` 是**挂载进容器**的。
        #    改文件**不会**让 compose 认为服务定义变了（bind mount 的源路径没变）⟹
        #    `up -d` 不重建 prometheus，进程里还是**旧配置**。
        #
        # ⚠️ **2026-10-19 的教训**：这里原来写的是
        #        docker exec gq-prometheus wget -qO- --post-data='' .../-/reload
        #    在 CI 里**静默没生效**（Prometheus 日志里一条 load 记录都没有），
        #    而它末尾又挂着 `|| echo 跳过` —— 于是"规则没更新"这件事**完全没有痕迹**：
        #    正式规则迟迟不生效，告警继续按临时阈值在跑（人工 reload 才恢复）。
        #    📌 结论：**"失败就算成功"的兜底 + 看不见的通道 = 静默失效**。
        #    ⟹ 改成**确定性动作**：`docker restart`（容器不存在会直接非零），
        #      再轮询 `/-/healthy` 确认它真回来了 —— 读不懂规则就起不来，这一关会红。
        run: |
          set -euo pipefail
          ssh target "docker restart gq-prometheus"
          for i in $(seq 1 12); do
            if ssh target "docker exec gq-prometheus wget -qO- http://127.0.0.1:9090/-/healthy" >/dev/null 2>&1; then
              echo "✅ Prometheus 已重启并在线（第 ${i} 次探测）"
              exit 0
            fi
            echo "…第 ${i} 次探测未就绪，5s 后重试"
            sleep 5
          done
          echo "❌ Prometheus 重启后没起来 —— 大概率是 alerts.yml 写错了"
          ssh target "docker logs --tail 40 gq-prometheus" || true
          exit 1

      - name: 部署成功 → 记录当前版本
        if: success()
        run: |
          set -euo pipefail
          ssh target "printf '%s\n' '$IMAGE_TAG' > $REMOTE_DIR/.current_tag"
          echo "已记录当前版本：$IMAGE_TAG"

      - name: 清理旧镜像（防历史 tag 把 40G 盘撑满）
        # ⚠️⚠️ **2026-10-28 事故**：一天里部署了十来次，每次 `compose pull` 都留下一个新 tag，
        #    服务器上攒到 **306 个镜像 / 34.3 GB** ⟹ 40G 盘 **100% 满** ⟹
        #    postgres 写不了 `postmaster.pid`（crash loop）⟹ api 连不上库 ⟹
        #    登录 / 会话列表全 **500**，而 `/healthz` 照样 200（它不碰库）。
        #    ⟹ 每次部署成功后清掉 **48 小时前**的镜像；正在跑的不受影响。
        #    镜像在 ACR 里，要回滚直接 pull 回来 —— 本地旧 tag 没有保留价值。
        if: success()
        run: |
          set -euo pipefail
          ssh target "docker image prune -af --filter 'until=48h' | tail -n 1"
          ssh target "df -h / | tail -n 1"

      - name: 部署失败 → 自动回滚
        # ⚠️⚠️ **2026-10-28（W24）：内容失败不再回滚代码。**
        #
        #    回滚是给**坏镜像**用的，不是给**坏数据**用的。以前任何一步红都回滚 ——
        #    2026-10-27 就撞上了：百炼预算耗尽 ⟹ 「灌知识库」报 embedding 400 ⟹
        #    自动回滚到旧镜像，**而迁移已经前进**（单向，退不回去）⟹ 现场是
        #    「库新、代码旧」，而且 `/healthz` 还是 200，比整个挂掉更难发现。
        #
        #    现在只排除**灌库**这一步：它红了照样让整条部署**红**（看得见），
        #    但代码留在新的 —— 修好数据/额度后重跑 ingest 就行，不用重新部署。
        #    其余失败（镜像拉不下来、容器起不来、健康检查不过、迁移失败…）照旧回滚。
        if: failure() && steps.ingest.outcome != 'failure'
        run: |
          set -euo pipefail
          prev='${{ steps.prev.outputs.tag }}'
          if [ -z "$prev" ]; then
            echo "⚠️ 没有可回滚的版本（首次部署），请人工介入"
            ssh target "cd $REMOTE_DIR && docker compose -f $COMPOSE_FILE ps" || true
            exit 1
          fi
          echo "开始回滚到：$prev"
          ssh target "cd $REMOTE_DIR && \
            ACR_REGISTRY='$ACR_REGISTRY' IMAGE_TAG='$prev' \
            docker compose -f $COMPOSE_FILE --profile monitoring --profile feishu up -d --remove-orphans"
          ssh target "curl -fsS http://127.0.0.1:8080/healthz" \
            && echo "✅ 回滚成功" \
            || { echo "❌ 回滚后仍不健康，请立即人工介入"; exit 1; }

      - name: 内容灌库失败 → **不回滚**，代码留在新版
        # ⚠️ 这条存在的唯一目的：让"没回滚"这件事**有痕迹**。
        #    否则红了的流水线里看不到"为什么这次没回滚"，下次又要重新推理一遍。
        if: failure() && steps.ingest.outcome == 'failure'
        run: |
          echo "⚠️ 「灌知识库」失败：代码**已上线**（未回滚），库里的内容可能落后。"
          echo "   处理：修好数据 / 额度后，单独重跑这一步（或在服务器上执行 ingest）。"
          echo "   判断部署是否真的生效，看：docker inspect gq-api 的 image tag。"

      - name: 失败时导出容器日志
        if: failure()
        # ⚠️ 带 `--profile monitoring`：不带的话 `logs` 只覆盖默认集合，
        #    而红掉的恰恰可能是 prometheus（拉不到 / 起不来 / OOM）。
        # ⚠️ `--profile feishu` 同理：飞书进程的报错只会出现在它自己的日志里。
        run: |
          ssh target "cd $REMOTE_DIR && docker compose -f $COMPOSE_FILE --profile monitoring --profile feishu logs --tail=200" || true
