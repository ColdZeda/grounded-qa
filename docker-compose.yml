# ============================================================
# grounded-qa · 本地开发 compose
# ------------------------------------------------------------
# 用途：本机起 PG + Redis + 应用，跑通 §5.1 日常循环的第 ③ 步
#       （AGENTS.md：「本地 docker compose up 验证 ← 起 PG/Redis/应用，浏览器点一遍」）
#
# ⚠️ 服务器形态**不共用这份文件**，在 deploy/docker-compose.prod.yml
#    （那份才带 nginx / Prometheus / node_exporter 和严格的内存上限）。
#
# ⚠️ 硬性要求（AGENTS.md §5.2 部署前检查清单）：
#    每个服务都要有 mem_limit + healthcheck + restart。
# ============================================================

name: grounded-qa

services:
  # ------------------------------------------------------------
  # PostgreSQL 16 + pgvector
  # 本地依赖服务一律用 compose 起，**不要装到 Windows 宿主机**
  # ------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: gq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grounded_qa}
      POSTGRES_USER: ${POSTGRES_USER:-grounded}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      # 让容器内的初始化脚本也走 UTF-8
      # ⚠️ **ctype 必须是 C.UTF-8，不能是 C。**
      #    `pg_trgm` 判断"什么字符算词"用的是数据库的 **ctype**。
      #    在 `C` 下，中文不算字母 → `show_trgm('退款政策')` 返回**空集** →
      #    `word_similarity()` 恒为 0 → **全文检索对中文彻底失效，而且不报错**。
      #    2026-10-14 实测：`C` → 0；`C.UTF-8` → 0.4（正常）。
      #    📌 改这一行只影响**新建**的库；已有库要重建（见 AGENTS §10）。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
    ports:
      # ⚠️ 宿主机端口刻意用 55432，**不是 5432**。
      #    本机同时还有项目 #1（langgraph-mcp-code-agent），它的依赖栈占了
      #    3307 / 6379 / 8888 / 80 —— 避开才能在两边同时跑。
      #    容器内部仍是标准 5432（见 api/worker 的 POSTGRES_PORT 覆盖）。
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 220m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grounded} -d ${POSTGRES_DB:-grounded_qa}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------
  # Redis：语义缓存 + BLPOP 队列
  # ------------------------------------------------------------
  redis:
    image: redis:7.4.1-alpine
    container_name: gq-redis
    restart: unless-stopped
    # maxmemory 与淘汰策略必须显式设：2C2G 上不能让 Redis 无限涨
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-96mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      # ⚠️ 宿主机 56379，**不是 6379** —— 项目 #1 的 redis-stack-server 正占着 6379，
      #    两边都用默认值就必撞。
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ------------------------------------------------------------
  # 自研 API（FastAPI + SSE）
  # ------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: grounded-qa-api:0.1.0
    container_name: gq-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内要用服务名，不是 localhost
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # ⚠️ 容器内部**用标准端口**：宿主机映射出去的 55432 / 56379 只给本机工具用。
      #    不显式写这两行的话，会继承 .env 里的值，容易和宿主机映射搞混。
      POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"
    ports:
      # ⚠️ 宿主机 58000，不是 8000（避开同机其他项目）
      - "127.0.0.1:${API_HOST_PORT:-58000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ⚠️ 上传文件的停放目录：api 写、worker 读（同一个命名卷）。
    volumes:
      - uploads:/app/uploads
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------
  # 飞书渠道（v1.2 第①项）：常驻长连接
  # ⚠️ **和 api / worker 同一个镜像**，只是 `command` 不同 —— 长连接要一直挂着，
  #    塞进 API 进程会跟着它重启，也把"请求-响应"和"常驻连接"两种生命周期混在一起。
  # ⚠️ **`restart: on-failure`，不是 `unless-stopped`**：`FEISHU_ENABLED=false` 时进程
  #    会**正常退出（0）**；用 `unless-stopped` 的话 Docker 会一直把它拉起来 ——
  #    重启风暴 + 日志刷屏。`on-failure` 只在非 0 退出（真故障 / 配置错）时重试。
  # ⚠️ 挂在 `feishu` profile 下：不显式启用就不会被拉起（本地默认不起它）。
  # ------------------------------------------------------------
  feishu:
    profiles: ["feishu"]
    build:
      context: .
      dockerfile: Dockerfile
    image: grounded-qa-api:0.1.0
    container_name: gq-feishu
    restart: on-failure
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.channels.feishu_runner"]
    mem_limit: 128m
    healthcheck:
      # ⚠️ 只能查"进程还在吗"：它没有监听端口（长连接是**出站**的）。
      #    镜像里装了 procps（worker 的 healthcheck 也靠它），`pgrep` 可用。
      test: ["CMD", "pgrep", "-f", "app.channels.feishu_runner"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ------------------------------------------------------------
  # 自研 mini worker（Redis BLPOP；**不是 Celery**）
  # 文档解析 / 切分 / 向量化，串行执行
  # ------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: grounded-qa-api:0.1.0
    container_name: gq-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"
    command: ["python", "-m", "app.workers.main"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    # 解析任务串行 + mem_limit 兜底，防止大文档把机器打爆
    mem_limit: 160m
    healthcheck:
      # 骨架阶段还没有 worker 主循环，先探进程活着
      test: ["CMD-SHELL", "pgrep -f 'app.workers.main' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
    name: gq-pgdata
  # 上传文件的传送带（api ⇄ worker）。**不是存储**：worker 处理完就删。
  uploads:
    name: gq-uploads
