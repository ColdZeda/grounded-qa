# ============================================================
# grounded-qa · 服务器生产 compose
# ------------------------------------------------------------
# ⚠️ 与本地开发用的 docker-compose.yml **不共用**：
#    这份才带 nginx、严格的 mem_limit、镜像来自 ACR。
#
# 硬性要求（AGENTS.md §5.2）：每个服务都有
#    mem_limit + healthcheck + restart: unless-stopped
#
# 内存预算（计划书 §2.3）：**全栈期望占用合计 ≈ 670 MB**（这个数里**已经含** Prometheus
# 120 MB + node_exporter 20 MB；只跑 v1.0 的五服务约 530 MB），可用 ≈ 1180 MB（瘦身后实测）。
# 下面的 mem_limit 是**硬上限**，按"期望值 + 余量"设置：
# **不带监控合计 768 MB**（v1.0），**带 `--profile monitoring` 合计 960 MB**（v1.1 起 CD 默认启用）。
# 📌 2026-10-18 实测 7 容器常驻 ≈ 282 MB（监控只占 ≈ 67 MB）。
# ============================================================

name: grounded-qa

# 镜像来自 ACR（CI 构建并推送）。用变量而不是写死地址。
x-api-image: &api-image
  image: ${ACR_REGISTRY:?ACR_REGISTRY 未设置}/grounded-qa-api:${IMAGE_TAG:-0.1.0}

x-api-common: &api-common
  <<: *api-image
  restart: unless-stopped
  env_file:
    - .env
  environment:
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    # 看板从这里去问 Prometheus。写成 compose 环境变量而不是 .env 里的秘密：
    # 这是**拓扑**（容器间怎么称呼对方），不是配置项 —— 换网络时只有这一处要改。
    PROMETHEUS_URL: http://prometheus:9090
  # ⚠️ 上传文件的**停放目录**：api 写、worker 读，所以两边挂**同一个**命名卷。
  #    只挂一边的话，worker 永远读不到 api 刚写的文件 —— 表现是"全部失败：文件不存在"。
  #    卷名固定 `gq-uploads`（不是 compose 自动前缀），与 `gq-pgdata` 同一套命名规矩。
  volumes:
    - uploads:/app/uploads
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ------------------------------------------------------------
  # 网关 + 前端静态（:8080）
  # ------------------------------------------------------------
  nginx:
    image: ${ACR_REGISTRY:?ACR_REGISTRY 未设置}/grounded-qa-nginx:${IMAGE_TAG:-0.1.0}
    container_name: gq-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 32m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------
  # 自研 API（FastAPI + SSE）
  # ------------------------------------------------------------
  api:
    <<: *api-common
    container_name: gq-api
    # 只在内网暴露，公网入口只有 nginx:8080
    expose:
      - "8000"
    mem_limit: 224m
    # 内存紧张时优先杀它，而不是 PG
    oom_score_adj: 100
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------
  # 飞书渠道（v1.2 第①项）：常驻长连接
  # ⚠️ 和 api / worker **同一个镜像**，只是 command 不同。
  # ⚠️ `restart: on-failure`（**不是** `unless-stopped`）：`FEISHU_ENABLED=false` 时进程
  #    正常退出（0），`unless-stopped` 会把它无限拉起 → 重启风暴 + 日志刷屏。
  # ⚠️ 挂在 `feishu` profile 下，CD 里四处都要带 `--profile feishu` ——
  #    不带的话 `up -d --remove-orphans` 会把它当孤儿删掉（`AGENTS §10` monitoring 那个坑的翻版）。
  # ------------------------------------------------------------
  feishu:
    <<: *api-common
    container_name: gq-feishu
    profiles: ["feishu"]
    restart: on-failure
    command: ["python", "-m", "app.channels.feishu_runner"]
    mem_limit: 96m
    healthcheck:
      # ⚠️ 没有监听端口（长连接是**出站**），只能查进程
      test: ["CMD-SHELL", "pgrep -f 'app.channels.feishu_runner' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ------------------------------------------------------------
  # 自研 mini worker（Redis BLPOP，不是 Celery）
  # ------------------------------------------------------------
  worker:
    <<: *api-common
    container_name: gq-worker
    command: ["python", "-m", "app.workers.main"]
    mem_limit: 96m
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'app.workers.main' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ------------------------------------------------------------
  # PostgreSQL 16 + pgvector
  # ------------------------------------------------------------
  postgres:
    # ⚠️ 走 ACR，不用 Docker Hub 原名（2026-10-17 首次部署的根因）。
    #    服务器所在网络的加速器 `5haml59c.mirror.aliyuncs.com` **没有这个镜像**（404），
    #    daocloud 对 pgvector 是 502。只 `docker tag` 到本地**不够**：
    #    CD 里是 `compose pull && up -d`，`pull` 照样按 `image:` 的原名去 Docker Hub 拉 → 还是失败。
    #    ⟹ 公共基础镜像必须和自建镜像一样：**CI 推进 ACR，服务器只从 ACR 拉**。
    image: ${ACR_REGISTRY:?ACR_REGISTRY 未设置}/pgvector:0.8.0-pg16
    container_name: gq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grounded_qa}
      POSTGRES_USER: ${POSTGRES_USER:-grounded}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
      # ⚠️ 必须与 dev（docker-compose.yml）**完全一致**，否则会出现
      #    "本地全文检索好好的，部署上去中文一条都搜不到"这种最难查的差异。
      #    ctype=C 时 pg_trgm 切不出中文三元组 → word_similarity 恒为 0，**且不报错**。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 288m
    # PG 被杀 = 数据服务中断，让它比 api 更"耐杀"
    oom_score_adj: -200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grounded} -d ${POSTGRES_DB:-grounded_qa}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------
  # Redis：语义缓存 + BLPOP 队列
  # ------------------------------------------------------------
  redis:
    # ⚠️ 同上：走 ACR。原名 `redis:7.4.1-alpine` 在加速器上不可靠 ——
    #    那次是靠 `docker.m.daocloud.io` 手工 retag 才拉到的，**下次换机器就复现不了**。
    image: ${ACR_REGISTRY:?ACR_REGISTRY 未设置}/redis:7.4.1-alpine
    container_name: gq-redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-96mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    volumes:
      - redisdata:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ------------------------------------------------------------
  # 可观测（v1.1 启用）—— 用 profile 控制，v1.0 不占内存
  #     docker compose --profile monitoring up -d
  # ⚠️ **两个 image 已改指 ACR**（2026-10-18，v1.1 第 0 步）：
  #    服务器拉不到 Docker Hub（AGENTS 硬约束 §2.5），而 `compose pull` 会
  #    按 `image:` 原名去拉 —— 只在本机 retag 不管用。上游镜像由 CI 的
  #    「把公共基础镜像补进 ACR（幂等）」那一步推进去，见 deploy.yml。
  # ⚠️ **CD 必须带 `--profile monitoring`**（deploy.yml 已加）：
  #    否则每次 `up -d --remove-orphans` 都会把这两个容器当成"孤儿"处理风险。
  # ------------------------------------------------------------
  prometheus:
    image: ${ACR_REGISTRY:?ACR_REGISTRY 未设置}/prometheus:v3.1.0
    container_name: gq-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 只保留 3 天，2C2G 上不能留长期数据
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # 告警规则。⚠️ 和 prometheus.yml 是**两个文件、同一次 scp** 过去的 ——
      # 只挂 prometheus.yml 时 `rule_files:` 指向不存在的文件，Prometheus **起不来**。
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    expose:
      - "9090"
    mem_limit: 160m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  node_exporter:
    image: ${ACR_REGISTRY:?ACR_REGISTRY 未设置}/node-exporter:v1.8.2
    container_name: gq-node-exporter
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    mem_limit: 32m

volumes:
  pgdata:
    name: gq-pgdata
  redisdata:
    name: gq-redisdata
  promdata:
    name: gq-promdata
  # 上传文件的传送带（api ⇄ worker）。**不是存储**：worker 处理完就删。
  # 删除这个卷是安全的 —— 丢的只是"还没处理完的上传"，已入库的块在 PG 里。
  uploads:
    name: gq-uploads
