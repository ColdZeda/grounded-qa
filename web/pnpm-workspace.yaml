# ============================================================
# pnpm 设置
# ------------------------------------------------------------
# pnpm 10+ 起，这些设置**不再从 package.json 的 "pnpm" 字段读取**，
# 搬到了这里（pnpm-workspace.yaml）。
#
# pnpm 默认**拦截依赖的 postinstall 脚本**（供应链安全考虑）。
# esbuild 需要它的构建脚本才能落原生二进制，所以在这里显式放行。
#
# 报错长相：
#   ERR_PNPM_IGNORED_BUILDS: Ignored build scripts: esbuild@0.25.0
# ============================================================

allowBuilds:
  esbuild: true
