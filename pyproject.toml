[project]
name = "grounded-qa"
version = "0.1.0"
description = "多租户知识库问答平台（客服是第一个业务场景）—— 深度锚：检索质量与幻觉治理"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# ⚠️ 依赖只写**下界 + 主版本上界**；真正的精确锁定交给 uv.lock（必须提交）。
#    绝不出现 `latest`（AGENTS 硬约束 §2.6）。
dependencies = [
    # --- Web 框架 ---
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.17,<1.0",
    # --- 配置 / 校验 ---
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    # EmailStr 需要它（pydantic 自己的可选依赖，显式写出来更清楚）
    "email-validator>=2.2,<3.0",
    # ⚠️ Windows 上**没有系统时区数据库**，`zoneinfo.ZoneInfo("Asia/Shanghai")` 会抛
    #    "Can't locate timezone"（Alembic 的 `timezone` 配置就会踩到）。
    #    Linux 一般有 /usr/share/zoneinfo，但这个包纯数据、体积小，
    #    装上能让本地和服务器行为一致，不值得省。
    "tzdata>=2024.2",
    # --- 数据库 ---
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "pgvector>=0.3.6,<1.0",
    "alembic>=1.14,<2.0",
    # --- 鉴权 ---
    # bcrypt：密码哈希。⚠️ 选它而不是 argon2 —— bcrypt 有 **abi3 wheel**（cp39+ 通用），
    #         Python 3.13 上直接装；argon2-cffi 的 C 扩展在 3.13 上不一定有预编译包，
    #         一旦要现场编译，CI 变慢 / 容器构建可能失败。**能装上是第一位的。**
    "bcrypt>=4.2,<5.0",
    # PyJWT：纯 Python，无 C 扩展，签 / 验 token
    "pyjwt>=2.10,<3.0",
    # --- 缓存 / 队列（自研 mini worker 用 BLPOP，不用 Celery）---
    "redis>=5.2,<6.0",
    # --- HTTP 客户端（所有模型都走 API）---
    "httpx>=0.28,<1.0",
    # --- LangChain 最小集（只要组件，不要全家桶）---
    "langchain-core>=0.3.28,<0.4",
    "langchain-text-splitters>=0.3.4,<0.4",
    # --- 可观测 ---
    "prometheus-client>=0.21,<1.0",
    # --- 图片（提问带图：读尺寸 / 嗅探格式 / EXIF 转正 / 送模型前降采样）---
    # ⚠️ 这是本项目**第一个图像依赖**。选 Pillow 而不是自己写：它同时给了
    #    "按内容认格式"（不信后缀）和 "EXIF 转正"（手机照片常带旋转标记，
    #    不转正模型看到的是躺倒的图 —— 字全废）。
    "pillow>=11.0,<13.0",
]

[project.optional-dependencies]
# 飞书渠道（v1.2 才用；v1.0 只预留 channels/ 目录）
feishu = ["lark-oapi>=1.4,<2.0"]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "mypy>=1.13,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ============================================================
# ruff —— 沿项目 #1 的做法：line-length 100，E501 交给 formatter
# ============================================================
[tool.ruff]
line-length = 100
target-version = "py313"
# 前端 / 文档 / 部署配置不归 ruff 管
extend-exclude = ["web", "docs", "deploy", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "S"]
ignore = [
    "E501",   # 行宽交给 formatter，不重复告警
    "S101",   # 测试里就是要用 assert
    # 本仓库的注释与文档字符串是**中文**，全角标点（，。：（））是刻意的。
    # RUF001/2/3 是为"英文代码里混进易混淆字符"设计的，在中文语境下全是误报。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# 配置模块天然要写占位默认值（不是真密钥）；容器里也必须绑 0.0.0.0
"app/core/config.py" = ["S104", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================
# pytest —— 沿项目 #1 的做法：asyncio_mode = auto
# ============================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: 需要真实依赖服务（PG / Redis）的测试，本地无 docker 时用 -m 'not integration' 跳过",
]

# ============================================================
# mypy（先松后紧；骨架阶段不阻塞）
# ============================================================
[tool.mypy]
python_version = "3.13"
files = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
