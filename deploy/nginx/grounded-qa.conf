# ============================================================
# grounded-qa · nginx 站点配置
# ------------------------------------------------------------
# 监听 8080（**不是 80**）：
#   大陆未备案服务器 80/443 可能被阻断，服务按 8080 规划。
#   见 AGENTS.md §10 已知坑。
#
# 本文件被 include 在 http 上下文里（conf.d/*.conf），
# 所以 limit_req_zone 这类 http 级指令可以写在这里。
# ============================================================

# ---------- 限流 ----------
# ⚠️ 这是**粗筛**（挡扫描器 / 挡单机刷），不是产品限额。
#    产品限额在应用里按**用户**算（`app/core/limits.py`：30 次/分钟/用户，
#    另有一天的 token 配额）。两道分工：
#      · nginx：按 IP —— 挡"一个 IP 打一万次"，它不知道谁是谁
#      · 应用：按用户（token 里的 user id）—— 挡"一个人刷"，换 IP 也绕不过去
# ⚠️ 数值关系是**有意的**：nginx 这道必须**明显宽于**应用那道。
#    写反了（比如两边都写 30）的后果很具体 —— 用户先撞上 nginx 的 **HTML 错误页**，
#    前端只能显示"请求失败（HTTP 429）"，说不出"还有 12 秒"。
# ⚠️ 更要紧的是**轮询**：知识库页在入库期间每 1.5 秒查一次状态（≈ 40 次/分钟），
#    原来的 30r/m 会被它自己撞穿 —— 上一版就埋着这颗雷（一次大文件上传就可能踩到）。
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=120r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

upstream grounded_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # 请求体上限：**这道只是兜底**，真正的上限在应用里（文档 2 MB / 图片 8 MB）。
    # ⚠️ 为什么不开到 32m：nginx 会**先把请求体落盘**再转给上游，
    #    上限开太大 = 任何人都能用几十兆的垃圾请求把这块 40 GB 的盘写满。
    # ⚠️ 12m 是按**最大的那个应用上限**（图片 8 MB）留的余量：multipart 的头 + boundary
    #    再算上一点点，8m 会卡在边界上。**改应用上限时必须同步这里** ——
    #    不然症状是"本地传得上去、部署后传不上"：超限请求是被 nginx 用**它自己的
    #    HTML 错误页**挡回来的，前端解析不了（2026-10-24 抬到 8 MB 时一起改的）。
    # 📌 本文件是**打进 nginx 镜像**的（`deploy/nginx/Dockerfile` 里 COPY，不是卷挂载），
    #    镜像 tag 又是 commit SHA ⟹ push 之后下一次 CD 会自然带着新配置重建容器，
    #    **不需要上服务器手动 reload**。（反过来说：只改文件不 push，服务器上什么也不会变。）
    client_max_body_size 12m;
    client_body_timeout 60s;

    # 不在响应里暴露 nginx 版本
    server_tokens off;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 运维端点：只给本机 / 内网，不对公网暴露 ----------
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://grounded_api;
    }

    location = /healthz {
        # 部署 job 会轮询它，必须稳定且便宜
        access_log off;
        proxy_pass http://grounded_api;
    }

    # ---------- API：SSE 流式必须不缓冲 ----------
    location /api/ {
        limit_req zone=api_rl burst=30 nodelay;
        limit_conn conn_per_ip 20;

        proxy_pass http://grounded_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # ⚠️ SSE 的关键三行：不缓冲、不缓存、读超时放宽。
        #    少了这三行，前端会"等全部生成完才一次性吐出来"。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering "no" always;

        # 生成类请求可能很久，但连接失败要快速暴露
        proxy_connect_timeout 5s;
    }

    # ---------- 前端静态资源 ----------
    location /assets/ {
        root /usr/share/nginx/html;
        # 带内容哈希的文件可以长期缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- SPA 兜底：非 /api 的路径都交给 index.html ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # index.html 不缓存，避免发版后拿到旧壳
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
