# ============================================================
# grounded-qa · nginx 站点配置
# ------------------------------------------------------------
# 监听 8080（**不是 80**）：
#   大陆未备案服务器 80/443 可能被阻断，服务按 8080 规划。
#   见 AGENTS.md §10 已知坑。
#
# 本文件被 include 在 http 上下文里（conf.d/*.conf），
# 所以 limit_req_zone 这类 http 级指令可以写在这里。
# ============================================================

# ---------- 限流 ----------
# 与后端配置里的 RATE_LIMIT_PER_MINUTE 保持一致（默认 30/分钟）
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=30r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

upstream grounded_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # 上传知识库文档：nginx 这道**只是兜底**，真正的上限在应用里
    # （`UPLOAD_MAX_BYTES`，默认 2 MB）。
    # ⚠️ 为什么不干脆放到 32m：nginx 会**先把请求体落盘**再转给上游，
    #    上限开太大 = 任何人都能用几十兆的垃圾请求把这块 40 GB 的盘写满。
    #    留 4m 是给 multipart 的头留余量，超了就由 nginx 直接 413。
    client_max_body_size 4m;
    client_body_timeout 60s;

    # 不在响应里暴露 nginx 版本
    server_tokens off;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- 运维端点：只给本机 / 内网，不对公网暴露 ----------
    location = /metrics {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://grounded_api;
    }

    location = /healthz {
        # 部署 job 会轮询它，必须稳定且便宜
        access_log off;
        proxy_pass http://grounded_api;
    }

    # ---------- API：SSE 流式必须不缓冲 ----------
    location /api/ {
        limit_req zone=api_rl burst=10 nodelay;
        limit_conn conn_per_ip 20;

        proxy_pass http://grounded_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # ⚠️ SSE 的关键三行：不缓冲、不缓存、读超时放宽。
        #    少了这三行，前端会"等全部生成完才一次性吐出来"。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering "no" always;

        # 生成类请求可能很久，但连接失败要快速暴露
        proxy_connect_timeout 5s;
    }

    # ---------- 前端静态资源 ----------
    location /assets/ {
        root /usr/share/nginx/html;
        # 带内容哈希的文件可以长期缓存
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- SPA 兜底：非 /api 的路径都交给 index.html ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # index.html 不缓存，避免发版后拿到旧壳
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
