# grounded-qa 固化参数
# ⚠️ 必须是 999- 前缀，才能排在软链 99-sysctl.conf 之后生效。
#    /etc/sysctl.d/99-sysctl.conf -> /etc/sysctl.conf，
#    字典序上 "99-grounded.conf" 会被它覆盖（且不报错）。
#    详见 AGENTS.md §10 已知坑。
#
# ⚠️ 这条不是"多此一举"：停掉 tuned 时它会**回滚**自己设过的值，
#    把 vm.swappiness 写成 0 —— 那样内核会极力避免换页，抬高 OOM 风险。

vm.swappiness = 10
